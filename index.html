<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Temario</title>
  <meta name="description" content="Seguimiento del temario estudiado, progreso y fechas de examen.">
  <meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f161d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Temario">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn back" id="backBtn" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="pageTitle">Temario</h1>
    <div class="topbar-actions" id="topActions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M4 13h11M4 8h7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Progreso</span>
    </a>
    <a href="#/asignaturas" data-tab="subjects">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM8 20a3 3 0 0 1 0-6h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Asignaturas</span>
    </a>
    <a href="#/calendario" data-tab="cal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Calendario</span>
    </a>
    <a href="#/ajustes" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5l1.6 1.2-2 3.5-1.9-.7a7.6 7.6 0 0 1-2 1.2l-.3 2H9.2l-.3-2a7.6 7.6 0 0 1-2-1.2l-1.9.7-2-3.5 1.6-1.2a7.7 7.7 0 0 1 0-3l-1.6-1.2 2-3.5 1.9.7a7.6 7.6 0 0 1 2-1.2l.3-2h5.6l.3 2a7.6 7.6 0 0 1 2 1.2l1.9-.7 2 3.5-1.6 1.2a7.7 7.7 0 0 1 0 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileIcs" accept=".ics,text/calendar" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
